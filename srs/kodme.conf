# http-hooks or http-callbacks config for srs.
# @see full.conf for detail config.

listen              1935;
max_connections     300;
daemon              off;
srs_log_tank        console;

# http_server
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# srt_server
srt_server { 
    enabled			off; 
}

# http_api
http_api {
    enabled         on;
    listen          1985;
}

# rtc_server
rtc_server {
    enabled			on;
    listen			8000;
    tcp {
        enabled		on;
        listen		8000;
    }
    protocol		all;
    # ⚠️ ПЛЕЙСХОЛДЕР: замените на публичный IP вашего сервера (как в external-ip coturn)
    candidate		YOUR_PUBLIC_IP;
}

# default vhost
vhost __defaultVhost__ {
    http_hooks { enabled off; }
    http_remux { enabled off; }
    rtc { enabled off; }
    hls { enabled off; }
    srt { enabled off; }
    dvr { enabled off; }
    transcode { enabled off; }
}

# vhost cast
vhost domain.ru {

    # play
    play {
        gop_cache true;
    }

    # http_hooks
    http_hooks {
        enabled         on;
        on_publish      http://kodme:3000/api/v1/cast/hooks/publish;
        on_unpublish    http://kodme:3000/api/v1/cast/hooks/unpublish;
        on_play         http://kodme:3000/api/v1/cast/hooks/play;
        on_stop         http://kodme:3000/api/v1/cast/hooks/stop;
    }

    # rtc
    rtc {
        enabled on;
        rtmp_to_rtc on;
        rtc_to_rtmp on;
        nack on;
        twcc on;
        keep_bframe off;
    }

    # hls
    hls {
        enabled on;
        hls_fragment 3;
        hls_window   15;
    }

    # http_remux
    http_remux {
        enabled on;
    }

    # srt
    srt {
        enabled off;
    }

    # dvr
    dvr {
        enabled off;
    }

    # transcode
    transcode {
        enabled off;
    }

}
