# *****************************************************
# s3.domain.ru | https
# *****************************************************
server {

	# server name
	server_name s3.domain.ru;

	# для лучшей совместимости рекомендуется использовать один порт для quic и https
    # указываем протокол quic и параметр reuseport для правильной работы с несколькими рабочими процессами
    listen 443 quic;
    listen 443 ssl;

    # включаем поддержку http2
    http2 on;

    # включаем поддержку http3
    http3 on;

    # разрешаем GSO
    quic_gso on;

    # разрешаем проверку адреса
    quic_retry on;

    # Для работы QUIC требуется версия протокола TLSv1.3.
    ssl_protocols TLSv1.2 TLSv1.3;

	ssl_certificate /etc/nginx/ssl/domain.ru/fullchain.pem;
	ssl_certificate_key /etc/nginx/ssl/domain.ru/privkey.pem;

	# для перенаправления браузеров в quic-порт
    add_header Alt-Svc 'h3=":443"; ma=86400';

	# nodejs app
	location / {

		proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';

        # --- CORS Headers ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, OPTIONS, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-amz-content-sha256,x-amz-date,x-amz-user-agent' always;
        add_header 'Access-Control-Expose-Headers' 'ETag, x-amz-request-id, x-amz-id-2, Content-Length, Content-Range' always;
        add_header 'Access-Control-Max-Age' 3600 always;

        # Обработка (OPTIONS)
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, OPTIONS, HEAD' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_redirect off;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;

        # Загрузки
        client_max_body_size 8g;
        proxy_request_buffering off;
        proxy_buffering off;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        client_body_timeout 3600s;

        # Хранилище объектов (SeaweedFS S3 API)
        proxy_pass http://seaweedfs:8333;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

    }

}

