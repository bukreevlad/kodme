# ==============================================================================
# RATE LIMITING ZONES (Ограничение частоты запросов по IP)
# ==============================================================================
limit_req_zone $binary_remote_addr zone=post_user_reg:10m           rate=2r/s;
limit_req_zone $binary_remote_addr zone=post_user_login:10m         rate=3r/s;
limit_req_zone $binary_remote_addr zone=post_user_confirm:10m       rate=1r/s;
limit_req_zone $binary_remote_addr zone=post_user_auth:10m          rate=5r/s;
limit_req_zone $binary_remote_addr zone=post_user_auth_refresh:10m  rate=2r/s;
limit_req_zone $binary_remote_addr zone=post_user_forgot_password:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m             rate=10r/s;


# ==============================================================================
# SERVER CONFIGURATION: domain.ru (HTTPS / HTTP2 / HTTP3 QUIC)
# ==============================================================================
server {
    server_name domain.ru;

    # --- Backend kodme: статический IP в compose-сегменте app ---
    # 10.90.0.20 — фиксированный адрес контейнера kodme (см. compose.yml,
    # networks.app.ipv4_address); при изменении IP поправь и здесь.

    # --- Сетевые протоколы (SSL, HTTP/2, HTTP/3 QUIC) ---
    listen 443 quic;
    listen 443 ssl;

    http2 on;
    http3 on;
    quic_gso on;
    quic_retry on;

    # --- SSL Сертификаты ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/domain.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/domain.ru/privkey.pem;

    # Заголовок для перенаправления браузеров на HTTP/3 (QUIC)
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # --- Корневая директория и статичные файлы ---
    root /usr/share/nginx/html/web-client/;
    index index.html;

    # Основная статика SPA (JS, CSS, картинки)
    location / {
        alias /usr/share/nginx/html/web-client/;
        expires 365d;
        gzip on;
        gzip_static on;
        gzip_types text/plain text/css application/javascript application/x-javascript text/javascript;
    }

    # Отмена кэширования для index.html (чтобы SPA сразу обновлялся у пользователей)
    location = /index.html {
        alias /usr/share/nginx/html/web-client/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }

    # Отмена кэширования для Service Worker
    location = /sw.js {
        alias /usr/share/nginx/html/web-client/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }


    # ==========================================================================
    # ВЕБХУКИ МЕДИАСЕРВЕРОВ (ТОЛЬКО ДЛЯ ВНУТРЕННЕЙ СЕТИ)
    # ==========================================================================
    # Хуки SRS и LiveKit вызываются сервисами напрямую (SRS → kodme:3000 по
    # сети контейнеров, LiveKit → 127.0.0.1:3000 в host-режиме) — наружу через
    # nginx они не должны быть доступны
    location /api/v1/cast/hooks/ {
        deny all;
    }

    location /api/v1/meet/hooks {
        deny all;
    }


    # ==========================================================================
    # ОСНОВНОЙ BACKEND API (на порту :3000)
    # ==========================================================================

    # 1. Общий location для всех прочих API запросов
    location /api/v1 {
        limit_req zone=api_general burst=30 nodelay;

        add_header X-RateLimit-Limit "10" always;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 2. Регистрация пользователя
    location /api/v1/auth/reg {
        limit_req zone=post_user_reg burst=5 nodelay;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 3. Авторизация (Вход)
    location /api/v1/auth/login {
        limit_req zone=post_user_login burst=10 nodelay;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 4. Проверка токена / сессии (/auth/check)
    location /api/v1/auth/check {
        limit_req zone=post_user_auth burst=15 nodelay;

        add_header X-RateLimit-Limit "5" always;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 5. Обновление токена (/auth/refresh)
    location /api/v1/auth/refresh {
        limit_req zone=post_user_auth_refresh burst=5 nodelay;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 6. WebSocket клиентские соединения
    location /api/v1/wss/client {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://10.90.0.20:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. Хранилище / Загрузка файлов (Storage)
    location /api/v1/storage {
        proxy_pass http://10.90.0.20:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключаем буферизацию для эффективной передачи больших файлов
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        proxy_pass_header Authorization;
    }


    # ==========================================================================
    # SRS МЕДИА-СЕРВЕР
    # ==========================================================================

    # 1. SRS WHIP Публикация трансляции (:1985)
    location /api/v1/cast/whip/ {
        proxy_pass http://srs:1985/rtc/v1/whip/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 2. SRS WHEP Проигрывание WebRTC (:1985)
    location /api/v1/cast/whep/ {
        proxy_pass http://srs:1985/rtc/v1/whep/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 3. SRS HTTP-FLV Проигрывание (:8080)
    location /api/v1/cast/flv/ {
        proxy_pass http://srs:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
    }

    # 4. SRS HLS Проигрывание (:8080)
    location /api/v1/cast/hls/ {
        proxy_set_header Accept-Encoding "";

        proxy_pass http://srs:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert $ssl_client_escaped_cert;

        # Перезапись относительных путей плейлистов в SRS HLS
        sub_filter_once off;
        sub_filter_types application/vnd.apple.mpegurl application/x-mpegURL application/octet-stream text/plain;
        sub_filter "/live/" "/api/v1/cast/hls/live/";
    }


    # ==========================================================================
    # LIVEKIT RTC (на порту :7880)
    # ==========================================================================
    location /api/v1/meet/ {
        proxy_pass http://host.containers.internal:7880/;  # livekit в host-режиме
        proxy_http_version 1.1;

        # WebSockets соединения
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача IP клиентов в LiveKit
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты и отключение буферизации для низкой задержки (Real-time)
        proxy_connect_timeout 90s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }


    # ==========================================================================
    # ОШИБКИ И СЛУЖЕБНЫЕ СТРАНИЦЫ
    # ==========================================================================
    error_page 500 502 503 504 /500.html;
    location /500.html {
        root /usr/share/nginx/html/web-client/;
    }
}
