# -----------------------------------------------------------------------------
# ГЛАВНЫЙ КОНФИГУРАЦИОННЫЙ ФАЙЛ ПЛАТФОРМЫ «Kodme»
# Содержит параметры подключений к БД, медиа-серверам, настройки безопасности,
# JWT-токенизации, модулей и сетевых узлов.

# -----------------------------------------------------------------------------
# 1. ОБЩИЕ МЕТАДАННЫЕ ПРИЛОЖЕНИЯ
# -----------------------------------------------------------------------------
# Название платформы
name: "Kodme"
version: "7.2.0" # Текущая версия сервера приложения

# -----------------------------------------------------------------------------
# 2. ДАННЫЕ ОРГАНИЗАЦИИ / ЛИЧНОГО КАБИНЕТА
# -----------------------------------------------------------------------------
organisation:
  lk_account: "" # Уникальный идентификатор аккаунта организации (UUID v7)
  name: "Kodme" # Наименование организации/проекта
  about: "" # Дополнительное описание организации

# -----------------------------------------------------------------------------
# 3. КОНФИГУРАЦИЯ ОСНОВНОГО СЕРВЕРА И МОДУЛЕЙ
# -----------------------------------------------------------------------------
server:
  # Список глобальных администраторов платформы (UUID пользователей)
  administrators:
    - id: ""

  # Поддерживаемые языковые локализации
  locales:
    - locale: "ru"
      name: "Русский"

  # Основной домен платформы
  host: "https://domain.ru"

  # Точка входа HTTP/REST API
  api:
    port: 3000

    # Ограничение частоты открытых HTTP-эндпоинтов (анти-брутфорс, анти-DoS).
    # Правило: [количество запросов, окно времени ("30s", "15m", "1h", "1d")].
    rate_limits:
      # Включение/выключение HTTP-лимитов
      enabled: true
      # Лимит по умолчанию для путей без собственного правила
      default: [10, "60s"]
      # Правила для конкретных путей (приоритет выше default)
      paths:
        "/api/v1/auth/reg": [3, "1h"]                             # 3 регистрации/час
        "/api/v1/auth/login": [10, "60s"]                         # 10 логинов/мин
        "/api/v1/auth/login/qrcode/gen-auth-session": [5, "60s"]  # 5 QR-сессий/мин
        "/api/v1/auth/login/qrcode/scanned": [20, "60s"]
        "/api/v1/auth/login/qrcode/confirm": [20, "60s"]
        "/api/v1/auth/login/qrcode/polling": [30, "60s"]
        "/api/v1/auth/confirm": [5, "60s"]                        # 5 вводов кода/мин
        "/api/v1/auth/refresh": [30, "60s"]
        "/api/v1/auth/forgot-password/send": [3, "1h"]            # 3 письма/час
        "/api/v1/auth/forgot-password/confirm": [5, "60s"]
        "/api/v1/auth/forgot-password/set-password": [5, "60s"]
        "/api/v1/auth/passkey/login/begin": [20, "60s"]             # 20 запросов челленджа/мин
        "/api/v1/auth/passkey/login/finish": [10, "60s"]            # 10 попыток входа/мин

  # Точка входа WS/REST API
  ws:
    # Ограничение частоты WebSocket-событий (анти-спам, анти-DoS).
    # Счетчик ведется на пользователя (user_id) и переживает переподключение сокета.
    # Правило: [количество запросов, окно времени ("30s", "15m", "1h", "1d")].
    rate_limits:
      # Включение/выключение всех WS-лимитов
      enabled: true

      # Лимит на любое событие по умолчанию (общий счетчик пользователя)
      default: [240, "60s"]

      # События, которые не учитываются (heartbeat проверять нельзя)
      ignore:
        - "[system]: ping"

      # Лимиты по модулям (имя модуля = префикс события в квадратных скобках).
      # Имеют приоритет выше default и ниже events.
      modules:
        message: [120, "60s"]           # Сообщения: отправка, чтение, правки
        channel: [60, "60s"]            # Действия с каналами
        channel-member: [120, "60s"]    # Прочтение, уведомления, набор текста
        channel-profile: [60, "60s"]    # Профиль канала (медиатека)
        group: [60, "60s"]              # Групповые чаты
        group-topic: [60, "60s"]        # Темы групп
        dialog: [60, "60s"]             # Личные диалоги
        user: [60, "60s"]               # Профиль и настройки пользователя
        contact: [60, "60s"]            # Контакты
        session: [30, "60s"]            # Управление сессиями и пуши
        search: [20, "60s"]             # Поиск (нагрузка на БД)
        invite: [30, "60s"]             # Инвайты
        cloud: [60, "60s"]              # Личное облако / избранное
        storage: [30, "60s"]            # Файловые операции
        broadcast: [30, "60s"]          # Трансляции
        broadcast-member: [30, "60s"]   # Участие в трансляциях
        meet: [30, "60s"]               # Встречи / конференции
        meet-member: [30, "60s"]        # Участие во встречах
        call: [60, "60s"]               # P2P звонки (частые обмены SDP/ICE)
        bot: [30, "60s"]                # Управление ботами
        bots-apps: [30, "60s"]          # Приложения ботов
        bot-form: [60, "60s"]           # Формы ботов
        theme: [30, "60s"]              # Темы оформления
        main: [60, "60s"]               # Папки и структура ленты
        admin: [10, "60s"]              # Админ-действия (строже)
        comment: [120, "60s"]           # Комментарии: чтение, отправка, реакции
        comment-member: [120, "60s"]    # Прочтение комментариев (высокая частота)
        sticker: [120, "60s"]            # Наборы стикеров (паки): чтение, подписки, управление
        security: [30, "60s"]            # 2FA (TOTP) и ключи доступа

      # Точечные правила по конкретным событиям (высший приоритет).
      # Ключ — полное имя события, как оно зарегистрировано в обработчике.
      events:
        "[message]: send": [30, "60s"]          # 30 сообщений/мин
        "[message]: forward": [30, "60s"]       # Кол. пересылылок сообщений
        "[comment]: send": [30, "60s"]          # 30 комментариев/мин
        "[channel]: user typing": [60, "60s"]   # Набор текста ~1 раз/сек
        "[search]: get users": [30, "60s"]      # Поиск пользователей
        "[search]: get channels": [30, "60s"]   # Поиск каналов
        "[search]: get groups": [30, "60s"]     # Поиск групп
        "[search]: get bots": [30, "60s"]       # Поиск ботов
        "[call]: start": [10, "60s"]            # Старт звонков
        "[call]: add participant": [10, "60s"]  # Приглашение в звонок

        # Загрузка стикеров: каждый файл — 2 события (presigned-ссылка + save),
        # поэтому у них свои лимиты вместо общего модульного счётчика.
        "[sticker]: get upload sticker url": [120, "60s"]  # presigned-ссылки на загрузку
        "[sticker]: save sticker": [120, "60s"]            # запись стикеров после загрузки

  # Переключатели функциональных модулей (Feature Flags).
  # Позволяют динамически включать или отключать функционал платформы.
  modules:
    # Регистрация новых пользователей и роль по умолчанию
    user_registration:
      enabled: true
      default_role: ""
    broadcasts: true # Трансляции / Стримы
    meets: true # Конференции / Встречи
    bots: true # Платформа ботов
    calls: true # P2P звонки
    channels: true # Публичные и приватные каналы
    groups: true # Групповые чаты
    dialogs: true # Личные диалоги
    themes: true # Кастомные темы оформления
    cloud: true # Избранное / Личное облако
    stickers: true # Стикерпаки
    comments: true # Комментарии к постам в сообществах

  # ---------------------------------------------------------------------------
  # Push-уведомления
  # ---------------------------------------------------------------------------
  # Web Push (VAPID ключи)
  web_pushes:
    public: ""
    private: ""

  # Firebase Cloud Messaging (Android / iOS / Web)
  fcm_pushes:
    type: ""
    project_id: ""
    private_key_id: ""
    private_key: |
      -----BEGIN PRIVATE KEY-----
      -----END PRIVATE KEY-----
    client_email: ""
    client_id: ""
    auth_uri: ""
    token_uri: ""
    auth_provider_x509_cert_url: ""
    client_x509_cert_url: ""
    universe_domain: ""

  # Huawei Mobile Services Push (для устройств Huawei/Honor)
  hms_pushes:
    app_id: ""
    client_id: ""
    client_secret: ""

  # ---------------------------------------------------------------------------
  # JWT Токенизация
  # ---------------------------------------------------------------------------
  jwt:
    # Аутентификация и сессии пользователей
    users:
      # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
      secret: "__JWT_USERS_SECRET__"
      algorithm: "HS256"
      issuer: "kodme"
      audience: "kodme-users"
      access_token_expiry: "15m" # Время жизни access токена
      refresh_token_expiry: "90d" # Время жизни refresh токена

    # Одноразовые токены файловых операций
    storage:
      # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
      secret: "__JWT_STORAGE_SECRET__"
      algorithm: "HS256"
      issuer: "kodme"
      audience: "storage-server"
      download_files_token_expiry: "5m" # Токен на скачивание файла

    # Токены доступа к онлайн-трансляциям
    broadcasts:
      # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
      secret: "__JWT_BROADCASTS_SECRET__"
      algorithm: "HS256"
      issuer: "kodme"
      audience: "kodme-users"
      view_token_expiry: "6h" # Максимальная длительность сессии просмотра

  # ---------------------------------------------------------------------------
  # WebRTC, ICE & TURN/STUN Серверы
  # ---------------------------------------------------------------------------
  web_rtc:
    # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
    # ДУБЛИКАТ: значение обязано совпадать со всеми ТРЁМЯ полями ниже одновременно:
    #   1) `static-auth-secret` в ../coturn/turnserver.conf
    #   2) `rtc.turn_servers[].secret` в ../livekit/livekit.yaml
    # Это секрет TURN REST API: сервер вычисляет HMAC-креды для ICE/TURN.
    # НЕ путать с `livekit.api_secret` — оно обязано быть ДРУГИМ.
    secret: "__TURN_SECRET__"
    # Время жизни учетных данных подключения (в секундах: 12 часов)
    access_credential_expiry: 43200

    # Список серверов прохождения NAT (STUN / TURN / TURNS)
    ice_servers:
      - urls:
          - "stun:domain.ru:3478"
          - "turn:domain.ru:3478?transport=udp"
          - "turns:domain.ru:5349?transport=tcp"

    # Ограничения битрейта медиапотоков (в бит/с)
    bitrates:
      caller: 600000 # P2P звонки (~600 kbps)
      broadcast: 6500000 # Видеотрансляции (~6.5 Mbps, 1080p)

  # ---------------------------------------------------------------------------
  # Двухфакторная авторизация и ключи доступа
  # ---------------------------------------------------------------------------
  security:
    # TOTP: коды из приложений-генераторов (Google Authenticator, Yandex Key и др.)
    totp:
      enabled: true # Разрешить пользователям включать TOTP
      issuer: "Kodme" # Название аккаунта в приложении-генераторе
      step: 30 # Шаг кода в секундах (RFC 6238)
      digits: 6 # Количество цифр в коде
      window: 1 # Допуск ±шагов при проверке (расхождение часов устройств)

    # Passkey (WebAuthn): вход по ключам доступа устройств
    webauthn:
      enabled: true # Разрешить вход и регистрацию Passkey
      # Origin (схема + хост) в формате «https://домен» — обязан совпадать с
      # адресом сайта в браузере, иначе браузер отклонит Passkey.
      # Пустое значение = брать server.host.
      origin: ""

# -----------------------------------------------------------------------------
# 4. БАЗА ДАННЫХ (POSTGRESQL & CONNECTION POOL)
# -----------------------------------------------------------------------------
database:
  user: "kodme"
  host: "db"
  database: "kodme"
  # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
  # ДУБЛИКАТ: значение обязано совпадать с `POSTGRES_PASSWORD` сервиса `db`
  # в ../compose.yml (эталон — compose.yml, он применяется при initdb).
  password: "__DB_PASSWORD__"
  port: 5432

  # Настройки пула подключений (pg pool)
  max_clients: 12 # Максимум активных соединений в пуле
  min_clients: 3 # Минимальный резерв постоянных соединений
  idle_timeout_millis: 30000 # Таймаут простоя перед закрытием соединения (30 сек)
  connection_timeout_millis: 5000 # Лимит времени на установку связи с БД (5 сек)
  max_uses_client: 3000 # Ротация соединения после N запросов (защита от утечек)

# -----------------------------------------------------------------------------
# 5. ПОЧТОВЫЙ СЕРВИС (SMTP)
# -----------------------------------------------------------------------------
mailer:
  email: "mail@yandex.ru"
  host: "smtp.yandex.ru"
  service: "Yandex"
  port: 465
  secure: true # Использование SSL/TLS
  auth:
    user: ""
    pass: ""

# -----------------------------------------------------------------------------
# 6. SRS (SIMPLE REALTIME SERVER - СТРИМИНГ МЕДИАПОТОКОВ)
# -----------------------------------------------------------------------------
srs:
  # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
  api_secret: "__SRS_API_SECRET__"
  api_host: "http://srs"
  api_port: 1985 # Стандартный HTTP API порт SRS сервера
  api_vhost: "domain.ru" # Виртуальный хост - указан в srs/kodme.conf

# -----------------------------------------------------------------------------
# 7. LIVEKIT (МЕДИАСЕРВЕР ДЛЯ КОНФЕРЕНЦИЙ)
# -----------------------------------------------------------------------------
livekit:
  api_key: "devkey"
  # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
  # ДУБЛИКАТ: значение обязано совпадать с `keys.devkey` в ../livekit/livekit.yaml
  #           и с `api_secret` в ../livekit/ingress.yaml.
  # ОБЯЗАНО ОТЛИЧАТЬСЯ от `server.web_rtc.secret` / coturn `static-auth-secret`.
  api_secret: "__LIVEKIT_API_SECRET__"
  api_host: "http://host.containers.internal" # livekit в host-режиме, доступен через хост
  api_port: 7880 # Порт сигналинга и WebSocket
  api_metric_port: 9090 # Порт Prometheus метрик (host-режим: хост:9090)
  api_ingress_port: 8085 # Порт захвата внешних RTMP/WHIP потоков (Ingress)

# -----------------------------------------------------------------------------
# 8. ОБЪЕКТНОЕ ХРАНИЛИЩЕ (SEAWEEFS / S3)
# -----------------------------------------------------------------------------
s3:
  # DNS-имя S3-хранилища. Без схемы и без порта.
  # ВАЖНО: это адрес, по которому пойдёт БРАУЗЕР, а не сервер.
  # Отсюда и публичный домен через nginx, а не внутренний адрес контейнера.
  endPoint: "s3.domain.ru"

  port: 443 # Порт S3 API
  useSSL: true # Использовать HTTPS

  # Регион для подписи запросов (SigV4). Большинство S3-совместимых
  # хранилищ его не проверяют, но подписывать запросы без него нельзя.
  # При переезде на облачный провайдер — подставить его регион.
  region: "us-east-1"

  # Path-style адресация: https://хост/бакет/... вместо https://бакет.хост/...
  # Нужна SeaweedFS/MinIO (у них нет DNS-поддомена бакета).
  # У облачного провайдера с виртуальным хостингом можно поставить false.
  pathStyle: true

  # Имя бакета, в котором хранятся файлы. Должно совпадать с `-bucket`
  # в compose контейнера SeaweedFS (бакет создаётся при старте).
  bucket: "kodme"

  # Имя пользователя / Access Key.
  accessKey: "kodme"

  # Секретный ключ S3.
  # ДУБЛИКАТ: значение обязано совпадать с `AWS_SECRET_ACCESS_KEY`
  # в compose контейнера SeaweedFS — иначе presigned-подписи не сойдутся.
  # Сгенерировать безопасный секрет можно командой: openssl rand -hex 32
  secretKey: "__S3_SECRET_KEY__"

# -----------------------------------------------------------------------------
# 9. Серверная обработка вложений (отдельный процесс медиа-воркера)
# -----------------------------------------------------------------------------
media_processing:
  # false → save attach отвечает "ready" без обработки: превью, метадата и
  # осциллограммы не создаются (деградация без превью, откат без выката).
  enabled: true

  # Сколько секунд save attach ждёт результат очереди. Должно быть меньше
  # клиентского таймаута (120 с), чтобы сервер успел ответить первым.
  timeout_seconds: 100

  # Период опроса очереди при ожидании результата (мс).
  poll_interval_ms: 200

  # Максимум попыток обработки задачи до терминального failed.
  max_attempts: 3

  # Таймаут одной задачи воркера (секунды): сверх — ретрай по таймауту.
  task_timeout_seconds: 90

  # Временная папка воркера для скачанных оригиналов (создаётся сама).
  temp_dir: "/tmp/kodme-media"

  # Срок хранения завершённых строк очереди в сутках (sweep раз в сутки).
  cleanup_days: 7

# -----------------------------------------------------------------------------
# 10. Лимиты платформы (единственный источник чисел «сколько можно»)
# -----------------------------------------------------------------------------
# Читает сервер при валидации и выдаче presigned-ссылок, клиент получает их
# при авторизации (HTTP /auth/check, поле server_data.limits) — правка значения
# не требует пересборки клиента или сервера. Группы и поля опциональны:
# пропущенное или пришедшее с неверным типом значение откатывается к дефолту
# из кода (см. getLimitsConfig).
limits:
  # Файлы: загрузка вложений, документов, обложек и файлов облака
  files:
    max_size_bytes: 524288000          # 500 МБ на один файл
    max_files_per_message: 10          # вложений в сообщении или комментарии
    max_file_name_length: 255          # символов
    max_metadata_bytes: 65536          # сериализованная метадата, байт

  # Сообщения: текст и кнопки
  messages:
    text_max_length: 4096              # символов, считаются кодовые точки
    max_buttons: 10                    # строк кнопок
    max_buttons_per_row: 5
    max_button_text_length: 64         # символов

  # Стикеры
  stickers:
    max_size_bytes: 524288             # 512 КБ
    max_dimension: 512                 # сторона изображения, px
    max_per_pak: 100                   # стикеров в паке
    pak_name_max_length: 64
    pak_about_max_length: 255

  # Медиа: геометрия производных объектов и границы метадаты
  media:
    thumbnail_sizes: [400, 800, 1200]             # ширины превью, по возрастанию
    rendition_labels: ["360", "720", "1080"]      # метки качества видео
    max_rendition_file_size_bytes: 104857600      # 100 МБ — крупнее грузим как есть
    wave_form_points: 60                          # точек осциллограммы
    max_duration_seconds: 86400                   # 24 часа
    max_dimension: 20000                          # сторона изображения, px
    max_tag_length: 256
    placeholder_max_bytes: 4096                   # LQIP, байт
